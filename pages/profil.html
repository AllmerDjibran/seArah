<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil Saya — SeArah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/typography.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/profile.css">
<link rel="stylesheet" href="../css/flow.css">
<link rel="stylesheet" href="../css/contact.css">
</head>
<body>

<div id="navbar-slot"></div>

<main class="wrap">
  <div class="profile-wrap" style="max-width:680px;margin:24px auto 60px">
    <div class="profile-card">
      <div class="profile-head" style="display:flex;align-items:center;gap:18px;margin-bottom:24px">
        <div class="navbar__avatar" id="pf-initial" style="width:72px;height:72px;font-size:28px">?</div>
        <div>
          <h1 id="pf-name" style="font-size:var(--text-2xl);margin:0">Pengguna</h1>
          <div style="display:flex;gap:6px;margin-top:6px">
            <span class="pill pill--blue" id="pf-role">Penumpang</span>
            <span class="pill pill--green">✓ Akun Aktif</span>
          </div>
        </div>
      </div>

      <div class="profile-grid" id="pf-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px">
        <!-- Injected by script -->
      </div>

      <!-- Quick Action Buttons -->
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn btn--primary" href="edit-profil.html">✏️ Edit Profil</a>
        <a class="btn btn--ghost" href="ubah-password.html">🔒 Ubah Password</a>
        <a class="btn btn--ghost" href="pembayaran.html">Hub Pesanan Aktif</a>
      </div>
    </div>
  </div>
</main>

<div id="footer-slot"></div>

<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
  UI.navbar("auto");
  UI.footer();

  if (!UI.requirePassenger()) throw new Error("redirect");
  const u = api.getSession();
  const pass = api.getPassenger() || {};

  document.getElementById("pf-name").textContent = u.name || pass.nama || u.email.split("@")[0];
  document.getElementById("pf-initial").textContent = (u.name || pass.nama || u.email || "?").charAt(0).toUpperCase();
  document.getElementById("pf-role").textContent = u.role === "pengemudi" ? "Mitra Pengemudi" : u.role === "admin" ? "Administrator" : "Penumpang";

  document.getElementById("pf-grid").innerHTML = `
    <div class="field">
      <label>Alamat Email</label>
      <div style="font-weight:700;color:var(--color-navy);margin-top:2px">${u.email || "-"}</div>
    </div>
    <div class="field">
      <label>Nomor WhatsApp / HP</label>
      <div style="font-weight:700;color:var(--color-navy);margin-top:2px">${pass.telepon || "-"}</div>
    </div>
    <div class="field">
      <label>Username</label>
      <div style="font-weight:700;color:var(--color-navy);margin-top:2px">${pass.username || "-"}</div>
    </div>
    <div class="field">
      <label>ID Pengguna</label>
      <div style="font-weight:700;color:var(--color-muted);margin-top:2px">${u.id || "-"}</div>
    </div>
  `;
</script>
</body>
</html>
