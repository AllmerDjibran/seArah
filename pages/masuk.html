<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk — SeArah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/typography.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/contact.css">
</head>
<body>

<div id="navbar-slot"></div>

<main class="wrap">
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Masuk ke SeArah</h1>
      <p class="sub">Masuk untuk mengelola pesanan &amp; perjalanan Anda</p>

      <form id="form-masuk" novalidate>
        <div class="field">
          <label for="email">Alamat Email</label>
          <input id="email" name="email" type="email" placeholder="nama@email.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button class="btn btn--primary btn--block btn--lg" type="submit" id="btn-login" style="margin-top:8px">
          Masuk ke Akun
        </button>
      </form>

      <!-- Quick Demo Accounts Helper -->
      <div class="demo-accounts">
        <b style="color:var(--color-navy);display:block;margin-bottom:4px">Akun Demo Pengujian:</b>
        <div>
          <span class="demo-pill">🔑 Admin Demo</span>
          <span class="demo-pill">🚗 Driver Demo</span>
        </div>
        <span style="font-size:11px;color:var(--color-muted);margin-top:4px;display:block">
          Klik akun di atas untuk mengisi formulir secara instan.
        </span>
      </div>

      <p class="auth-alt">
        Belum memiliki akun? <a href="daftar.html">Daftar sekarang</a>
      </p>
    </div>
  </div>
<section class="auth-card" id="app" style="max-width:540px;margin:24px auto"></section></main>

<div id="footer-slot"></div>




<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/frontend.js"></script>
</body>
</html>
