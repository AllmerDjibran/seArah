<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Verifikasi Pengemudi — SeArah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/typography.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/profile.css">
<link rel="stylesheet" href="../css/flow.css">
<link rel="stylesheet" href="../css/contact.css">
</head>
<body>

<div id="navbar-slot"></div>

<main class="wrap">
  <div style="max-width:960px;margin:24px auto 60px">
    <div class="flow-card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
        <div>
          <h1>Panel Verifikasi Mitra Pengemudi</h1>
          <p style="font-size:var(--text-sm);color:var(--color-muted);margin:0">
            Periksa keaslian dokumen KTP &amp; SIM mitra driver sesuai Dokumen Perencanaan Bagian 5.3.
          </p>
        </div>
        <span class="pill pill--blue">Akun Admin: admin@searah.id</span>
      </div>

      <!-- Filter status -->
      <div class="tabs" style="margin-top:20px;border-bottom:none" id="filter-tabs">
        <button class="tab" data-status="all" aria-selected="true">Semua Rekrut</button>
        <button class="tab" data-status="menunggu">Menunggu Verifikasi</button>
        <button class="tab" data-status="disetujui">Disetujui</button>
        <button class="tab" data-status="ditolak">Ditolak</button>
      </div>

      <!-- Driver List -->
      <div id="drivers-list" style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
        <!-- Injected by script -->
      </div>
    </div>
  </div>
</main>

<div id="footer-slot"></div>

<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
  UI.navbar("auto");
  UI.footer();

  const sess = api.getSession();
  if (!sess || sess.role !== "admin") {
    UI.toast("Halaman ini khusus untuk administrator.", "warning");
    setTimeout(() => { location.href = "masuk.html"; }, 500);
  }

  let curFilter = "all";
  const listEl = document.getElementById("drivers-list");

  document.querySelectorAll("#filter-tabs .tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      curFilter = tab.dataset.status;
      document.querySelectorAll("#filter-tabs .tab").forEach((t) => {
        t.setAttribute("aria-selected", t === tab);
      });
      render();
    });
  });

  async function render() {
    const allDrivers = await api.listPendingDrivers();
    // Kategorisasi konsisten: menunggu | disetujui (termasuk peringatan/suspen) | ditolak
    const bucket = (s) => (s === "menunggu" ? "menunggu" : s === "ditolak" ? "ditolak" : "disetujui");
    const filtered = allDrivers.filter((d) => curFilter === "all" || bucket(d.status) === curFilter);

    if (!filtered.length) {
      listEl.innerHTML = `
        <div style="text-align:center;padding:36px;color:var(--color-muted)">
          <div style="font-size:32px;margin-bottom:8px">📋</div>
          Tidak ada data mitra pengemudi dengan status ini.
        </div>`;
      return;
    }

    listEl.innerHTML = filtered.map((d) => {
      const isApproved = d.status === "disetujui" || d.status === "peringatan" || d.status === "suspen";
      const isRejected = d.status === "ditolak";
      const isPending = d.status === "menunggu";

      const badgeHtml = isApproved 
        ? `<span class="pill pill--green">✓ Disetujui</span>`
        : isRejected
        ? `<span class="pill pill--orange" style="background:#fee2e2;color:#dc2626">✗ Ditolak</span>`
        : `<span class="pill pill--orange">⏳ Menunggu Verifikasi</span>`;

      const docsList = d.documents && d.documents.length 
        ? d.documents.map((doc) => `
            <span class="pill pill--gray" style="font-size:11px">
              📄 ${doc.jenis} (${doc.file || 'dokumen.jpg'} - Versi ${doc.versi || 1})
            </span>
          `).join(" ")
        : `<span style="font-size:12px;color:var(--color-danger)">Belum mengunggah dokumen</span>`;

      return `
        <div style="border:1.5px solid var(--color-border);background:var(--color-white);border-radius:12px;padding:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px">
          <div style="flex:1;min-width:240px">
            <div style="display:flex;align-items:center;gap:10px">
              <b style="font-size:var(--text-base);color:var(--color-navy)">${d.name || d.email}</b>
              ${badgeHtml}
            </div>
            <div style="font-size:12px;color:var(--color-muted);margin:4px 0 8px">
              Email: <b>${d.email}</b>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
              <span style="font-size:12px;font-weight:600">Dokumen:</span>
              ${docsList}
            </div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <button class="btn btn--ghost btn--sm" onclick="previewDoc('${d.name || d.email}')">
              🔍 Periksa Foto
            </button>
            <button class="btn btn--primary btn--sm" data-approve="${d.user_id}" ${isApproved ? 'disabled' : ''}>
              ✓ Setujui
            </button>
            <button class="btn btn--danger btn--sm" data-reject="${d.user_id}" ${isRejected ? 'disabled' : ''}>
              ✗ Tolak + Catatan
            </button>
          </div>
        </div>
      `;
    }).join("");

    /* Event listeners approve & reject */
    listEl.querySelectorAll("[data-approve]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.approve;
        await api.reviewDriver({ driverId: id, approve: true });
        UI.toast("Driver berhasil disetujui. Akun sekarang aktif!", "success");
        render();
      });
    });

    listEl.querySelectorAll("[data-reject]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.reject;
        UI.modal({
          title: "Tolak Verifikasi Driver",
          content: `
            <p>Tuliskan catatan alasan penolakan (alasan ini akan tampil di aplikasi driver):</p>
            <textarea id="modal-note" rows="3" style="width:100%;margin-top:8px;padding:10px;border-radius:8px;border:1.5px solid var(--color-border);font-family:inherit" placeholder="Contoh: Foto SIM buram, mohon unggah ulang foto yang jelas dan tidak terpotong."></textarea>
          `,
          confirmText: "Kirim Penolakan",
          cancelText: "Batal",
          onConfirm: async () => {
            const noteEl = document.getElementById("modal-note");
            const note = noteEl ? noteEl.value.trim() : "Foto dokumen tidak terbaca.";
            await api.reviewDriver({ driverId: id, approve: false, note });
            UI.toast("Driver ditolak dengan catatan alasan.", "info");
            render();
          }
        });
      });
    });
  }

  function previewDoc(name) {
    UI.modal({
      title: `Pemeriksaan Dokumen — ${name}`,
      content: `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center">
          <div>
            <b>Foto KTP</b>
            <div style="background:#e2e8f0;height:120px;border-radius:8px;display:grid;place-items:center;margin-top:6px;font-size:32px;border:2px dashed #94a3b8">
              🪪
            </div>
            <span style="font-size:11px;color:var(--color-muted)">ktp-original.jpg (Terlampir)</span>
          </div>
          <div>
            <b>Foto SIM B/A</b>
            <div style="background:#e2e8f0;height:120px;border-radius:8px;display:grid;place-items:center;margin-top:6px;font-size:32px;border:2px dashed #94a3b8">
              🚗
            </div>
            <span style="font-size:11px;color:var(--color-muted)">sim-original.jpg (Terlampir)</span>
          </div>
        </div>
      `,
      confirmText: "Tutup",
      cancelText: ""
    });
  }

  render();
</script>
</body>
</html>
