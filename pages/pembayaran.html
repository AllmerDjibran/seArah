<style>
  /* Standar Frame QRIS Nasional */
  .qris-national-card {
    background: #ffffff;
    border: 2px solid #e2e8f0;
    border-radius: 18px;
    padding: 24px;
    max-width: 380px;
    margin: 20px auto;
    box-shadow: 0 12px 32px rgba(0, 32, 90, 0.12);
    text-align: center;
    position: relative;
  }
  .qris-national-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #0f172a;
    padding-bottom: 12px;
    margin-bottom: 14px;
  }
  .qris-badge-text {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: #b91c1c;
  }
  .qris-badge-text span {
    color: #1e293b;
  }
  .qris-nmid {
    font-size: 11px;
    font-weight: 700;
    color: #64748b;
    letter-spacing: 0.5px;
  }
  .qris-merchant-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--color-navy);
    margin: 8px 0 2px;
  }
  .qris-city {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 14px;
  }
  .qr-canvas-holder {
    background: #ffffff;
    padding: 14px;
    border-radius: 12px;
    display: inline-block;
    border: 1.5px solid #cbd5e1;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
    margin: 0 auto;
    position: relative;
  }
  .qr-canvas-holder svg {
    display: block;
    width: 210px;
    height: 210px;
  }
  .qris-center-logo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 36px;
    height: 36px;
    background: #ffffff;
    border-radius: 6px;
    padding: 3px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    display: grid;
    place-items: center;
  }
  .qris-center-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .qris-national-footer {
    border-top: 1px dashed #cbd5e1;
    margin-top: 16px;
    padding-top: 12px;
    font-size: 11px;
    color: #64748b;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
</style>
</head>

<div id="navbar-slot"></div>

<main class="wrap"><section class="flow-card" id="app" style="max-width:1040px;margin:24px auto 60px"><p>Memuat data server...</p></section></main>

<div id="footer-slot"></div>
