<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendaftaran Penumpang — SeArah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/typography.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/register.css">
<link rel="stylesheet" href="../css/contact.css">
</head>
<body>

<div id="navbar-slot"></div>

<main class="wrap">
  <div class="auth-wrap">
    <div class="form-page">
      <div id="stepper" style="margin-bottom:24px"></div>

      <div class="auth-card" style="width:100%">
        <form id="reg-form" novalidate>
          <!-- Step 1: Kredensial Akun -->
          <section class="reg-panel reg-panel--active" data-step="0">
            <h1>Buat Akun Penumpang</h1>
            <p class="sub">Langkah 1 dari 2: Alamat Email &amp; Password</p>

            <div style="display:flex;flex-direction:column;gap:14px;margin-top:20px">
              <div class="field">
                <label for="email">Alamat Email</label>
                <input id="email" name="email" type="email" placeholder="nama@email.com" autocomplete="email" required>
              </div>
              <div class="field">
                <label for="password">Password Akun</label>
                <input id="password" name="password" type="password" placeholder="Minimal 6 karakter" autocomplete="new-password" required>
              </div>
            </div>
          </section>

          <!-- Step 2: Data Diri Penumpang -->
          <section class="reg-panel" data-step="1">
            <h1>Data Diri Penumpang</h1>
            <p class="sub">Langkah 2 dari 2: Username &amp; Kontak WhatsApp</p>

            <div style="display:flex;flex-direction:column;gap:14px;margin-top:20px">
              <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" placeholder="Contoh: sarah99" required>
              </div>
              <div class="field">
                <label for="nama">Nama Lengkap Sesuai KTP</label>
                <input id="nama" name="nama" placeholder="Contoh: Sarah Paramita" required>
              </div>
              <div class="field">
                <label for="telepon">Nomor WhatsApp / HP Aktif</label>
                <input id="telepon" name="telepon" placeholder="Contoh: 081234567890" type="tel" required>
              </div>
            </div>
          </section>

          <div class="form-actions">
            <button type="button" class="btn btn--ghost" id="btn-back" hidden>‹ Kembali</button>
            <button type="button" class="btn btn--primary btn--lg" id="btn-next">Lanjut ke Data Diri ›</button>
          </div>
        </form>

        <p class="auth-alt">
          Sudah punya akun? <a href="masuk.html">Masuk di sini</a>
        </p>
      </div>
    </div>
  </div>
<section class="auth-card" id="app" style="max-width:540px;margin:24px auto"></section></main>

<div id="footer-slot"></div>





<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/frontend.js"></script>
</body>
</html>
