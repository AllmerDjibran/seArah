<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NusaShuttle – Travel Antar Kota</title>
<style>
:root{--bg:#f2f6fb;--card:#fff;--tx:#14213d;--mut:#5b6b85;--pri:#0b6bf0;--pri2:#e6f0ff;--acc:#ff8a1f;--bd:#dbe4f0;--ok:#12a150;--bad:#d93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1626;--card:#16223a;--tx:#eaf0fb;--mut:#9fb0cc;--pri:#4b94ff;--pri2:#1c2f52;--bd:#2a3b5c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1626;--card:#16223a;--tx:#eaf0fb;--mut:#9fb0cc;--pri:#4b94ff;--pri2:#1c2f52;--bd:#2a3b5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:10px 5%}
.logo{font-weight:800;font-size:20px;color:var(--pri);cursor:pointer}.logo b{color:var(--acc)}
.sp{flex:1}
button{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700}
.btn.o{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}.btn.a{background:var(--acc)}.btn.r{background:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn.w{width:100%}
main{max-width:1060px;margin:0 auto;padding:0 5% 90px}
.hero{margin:0 -5%;position:relative;color:#fff}
.hero svg{width:100%;height:340px;display:block;object-fit:cover}
.hero .t{position:absolute;left:5%;top:44px;max-width:560px}
.hero h1{margin:0 0 8px;font-size:clamp(26px,5vw,40px);line-height:1.15}.hero p{margin:0;opacity:.95}
.search{background:var(--card);border-radius:16px;box-shadow:0 8px 28px #0003;padding:16px;margin:-60px auto 28px;position:relative;max-width:1000px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 14px;font-weight:600}.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:3px}
input,select{width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
h2{margin:30px 0 12px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.card .pad{padding:14px}.card h3{margin:0 0 4px}.mut{color:var(--mut);font-size:13px}
.card svg{display:block;width:100%;height:130px}
.pill{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin:2px 4px 2px 0}
.pill.g{background:#12a15022;color:var(--ok)}.pill.o{background:#ff8a1f26;color:var(--acc)}
.feat{display:flex;gap:12px;padding:14px}.feat i{font-style:normal;font-size:26px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:16px 0}
.narrow{max-width:460px;margin:26px auto}
.sel{border:2px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;display:flex;gap:10px;align-items:center;background:var(--card)}.sel.on{border-color:var(--pri);background:var(--pri2)}
.steps{display:flex;gap:6px;margin-bottom:14px}.steps span{flex:1;height:5px;border-radius:5px;background:var(--bd)}.steps span.on{background:var(--pri)}
.note{background:#ff8a1f1f;border-left:4px solid var(--acc);padding:10px 12px;border-radius:8px;font-size:13px;margin:10px 0}
.f{margin:10px 0}
.up{border:2px dashed var(--bd);border-radius:12px;padding:12px;text-align:center}
.tl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tl span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--bd);color:var(--mut)}.tl span.on{background:var(--ok);color:#fff}
.stars button{background:none;border:0;font-size:28px;color:var(--bd);padding:0 2px}.stars button.on{color:#f5b301}
.drv{display:flex;gap:12px;align-items:center}.av{width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
.cta{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:9}
.cta a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;text-decoration:none;box-shadow:0 4px 12px #0004;cursor:pointer}
footer{text-align:center;color:var(--mut);font-size:13px;padding:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#14213d;color:#fff;padding:10px 18px;border-radius:10px;z-index:20}
</style></head><body>
<header><div class="logo" onclick="go('home')">Nusa<b>Shuttle</b></div><div class="sp"></div><div id="nav"></div></header>
<main id="app"></main>
<div class="cta">
<a style="background:#25d366" title="WhatsApp" onclick="toast('Membuka WhatsApp…')">WA</a>
<a style="background:linear-gradient(45deg,#f9a03f,#d6249f,#5b51d8)" title="Instagram" onclick="toast('Membuka Instagram…')">IG</a>
<a style="background:#111" title="TikTok" onclick="toast('Membuka TikTok…')">TT</a>
<a style="background:var(--pri)" title="Customer Service" onclick="toast('Menghubungkan ke Customer Service…')">CS</a></div>
<footer>© 2026 NusaShuttle · Prototype UI/UX · Harga &amp; pembayaran menyusul</footer>
<script>
const CITIES=['Kepanjen','Malang','Surabaya','Blitar','Sidoarjo','Batu'];
const P={reguler:{n:'Reguler',d:'Mobil &amp; driver acak. Datang ke garasi setelah checkout. Berbagi mobil.',road:'biasa',tag:'Garasi ke garasi'},
door:{n:'Door to Door',d:'Pilih mobil (prioritas yang sudah berisi), titik jemput &amp; antar sendiri.',road:'biasa',tag:'Jemput di titik pilihan'},
private:{n:'Private',d:'Pilih mobil, driver, titik jemput &amp; antar. Eksklusif, default tol.',road:'tol',tag:'Eksklusif'}};
const CARS=[{n:'Toyota Hiace Premio',pl:'N 7421 KP',fill:3,seat:7,d:'Budi Santoso',r:4.9,dir:'Kepanjen → Malang/Surabaya'},
{n:'Isuzu Elf Long',pl:'N 1180 AB',fill:2,seat:9,d:'Agus Wijaya',r:4.8,dir:'Kepanjen → Surabaya'},
{n:'Toyota Innova Zenix',pl:'N 9033 CD',fill:0,seat:6,d:'Dimas Pratama',r:4.7,dir:'Kosong'}];
let S={view:'home',user:null,role:'penumpang',step:1,pkg:'reguler',road:'biasa',ins:true,car:0,from:'Kepanjen',to:'Surabaya',date:'',pax:1,pick:'',drop:'',st:0,rating:0,drvState:'',cancelled:false};
const STAT=['Dibuat','Menunggu driver','Dikonfirmasi','Driver menuju lokasi','Berlangsung','Selesai'];
const $=s=>document.querySelector(s);
function go(v,st){S.view=v;if(st)S.step=st;render();scrollTo(0,0)}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
const car=(c='#fff',x=0)=>`<g transform="translate(${x},0)"><rect x="0" y="22" width="110" height="26" rx="9" fill="${c}"/><path d="M18 24l14-18h44l18 18z" fill="${c}"/><path d="M26 24l10-13h18v13zM60 24V11h14l12 13z" fill="#9ed0ff"/><circle cx="28" cy="50" r="9" fill="#222"/><circle cx="84" cy="50" r="9" fill="#222"/><circle cx="28" cy="50" r="4" fill="#bbb"/><circle cx="84" cy="50" r="4" fill="#bbb"/></g>`;
const scene=(a,b,inner)=>`<svg viewBox="0 0 400 130" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g${a.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="400" height="130" fill="url(#g${a.slice(1)})"/>${inner}</svg>`;
const IMG={
reguler:scene('#6ab7ff','#dff1ff',`<path d="M0 90Q80 60 160 85T320 80T400 90V130H0z" fill="#58b368"/><rect x="40" y="52" width="90" height="46" fill="#e8edf5"/><path d="M34 54l51-26 51 26z" fill="#c44"/><rect x="60" y="70" width="50" height="28" fill="#7a8aa5"/><rect y="100" width="400" height="30" fill="#556"/><g transform="translate(220,66) scale(.9)">${car('#ff8a1f')}</g>`),
door:scene('#ffd59a','#fff3df',`<path d="M0 95Q100 70 200 92T400 85V130H0z" fill="#7cc27b"/><rect y="102" width="400" height="28" fill="#556"/><g transform="translate(70,68) scale(.9)">${car('#0b6bf0')}</g><g transform="translate(300,18)"><path d="M0 0a20 20 0 0140 0c0 18-20 40-20 40S0 18 0 0z" fill="#d93025"/><circle cx="20" cy="0" r="7" fill="#fff"/></g><path d="M200 82q40-30 100-44" stroke="#d93025" stroke-width="3" stroke-dasharray="6 5" fill="none"/>`),
private:scene('#1b2f5c','#3b66b8',`<circle cx="330" cy="30" r="14" fill="#fff6c9"/><rect y="98" width="400" height="32" fill="#2a2f44"/><path d="M0 98h400" stroke="#ffd34d" stroke-width="2" stroke-dasharray="14 10"/><g transform="translate(130,56) scale(1)">${car('#111c33')}</g><g transform="translate(30,16)"><path d="M20 0l20 8v16c0 14-9 22-20 28C9 46 0 38 0 24V8z" fill="#12a150"/><path d="M11 24l7 7 12-14" stroke="#fff" stroke-width="4" fill="none"/></g>`)};
const HERO=`<svg viewBox="0 0 800 340" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b4fc4"/><stop offset="1" stop-color="#4fb3ff"/></linearGradient></defs><rect width="800" height="340" fill="url(#hg)"/><circle cx="660" cy="80" r="40" fill="#ffd34d" opacity=".9"/><path d="M0 250Q150 170 300 235T560 215T800 245V340H0z" fill="#2c8a5a"/><path d="M0 285Q200 240 400 280T800 270V340H0z" fill="#1f6b46"/><rect y="296" width="800" height="44" fill="#3a4157"/><path d="M0 318h800" stroke="#ffd34d" stroke-width="3" stroke-dasharray="26 18"/><g transform="translate(470,240) scale(1.5)">${car('#ff8a1f')}</g><g transform="translate(250,262) scale(1)" opacity=".95">${car('#fff')}</g><path d="M80 225l20-45 20 45z M120 225l25-58 25 58z" fill="#1b6b44"/></svg>`;

function renderNav(){const u=S.user;$('#nav').innerHTML=u?`<span class="mut">${u.role==='pengemudi'?'🚗':'👤'} ${u.name||u.email}</span> <button class="btn o" onclick="S.user=null;go('home')">Keluar</button>`:`<button class="btn o" onclick="S.role='penumpang';go('login')">Masuk</button> <button class="btn" onclick="go('role')">Daftar</button>`}
function render(){renderNav();$('#app').innerHTML=V[S.view]();}
const opts=a=>a.map(c=>`<option>${c}</option>`).join('');
const sel=(id,v)=>`<select id="${id}" onchange="S.${id}=this.value">${CITIES.map(c=>`<option ${c===v?'selected':''}>${c}</option>`).join('')}</select>`;
const V={
home(){return `<div class="hero">${HERO}<div class="t"><h1>Perjalanan antar kota, aman &amp; nyaman</h1><p>Pilih paket Reguler, Door to Door, atau Private. Driver terverifikasi, dilindungi asuransi.</p></div></div>
<div class="search"><div class="tabs">${Object.keys(P).map(k=>`<button class="tab ${S.pkg===k?'on':''}" onclick="setPkg('${k}');render()">${P[k].n}</button>`).join('')}</div>
<div class="row"><div><label>Asal</label>${sel('from',S.from)}</div><div><label>Tujuan</label>${sel('to',S.to)}</div><div><label>Tanggal</label><input type="date" id="date" value="${S.date}" onchange="S.date=this.value"></div><div><label>Penumpang</label><input type="number" min="1" max="7" id="pax" value="${S.pax}" onchange="S.pax=this.value"></div><button class="btn a" onclick="go('book')">Cari Perjalanan</button></div></div>
<h2>Pilih paket perjalanan</h2><div class="grid">${Object.keys(P).map(k=>`<div class="card">${IMG[k]}<div class="pad"><h3>${P[k].n}</h3><p class="mut">${P[k].d}</p><span class="pill">${P[k].tag}</span><span class="pill o">Jalan ${P[k].road==='tol'?'tol':'biasa (+tol)'}</span><br><br><button class="btn w" onclick="setPkg('${k}');go('book')">Pilih ${P[k].n}</button></div></div>`).join('')}</div>
<h2>Kenapa NusaShuttle?</h2><div class="grid">${[['🛡️','Asuransi perjalanan','Proteksi keamanan untuk setiap penumpang.'],['✅','Driver terverifikasi','KTP &amp; SIM diperiksa admin sebelum menerima order.'],['🪪','Identitas driver di HP','Nama, foto, kendaraan &amp; plat tampil jelas.'],['⭐','Rating &amp; ulasan','Nilai driver setelah perjalanan selesai.'],['👥','Berbagi mobil searah','Kepanjen → Malang &amp; Surabaya bisa satu mobil.'],['🧾','Invoice otomatis','Terunduh langsung setelah pesanan dikonfirmasi.']].map(f=>`<div class="card feat"><i>${f[0]}</i><div><b>${f[1]}</b><div class="mut">${f[2]}</div></div></div>`).join('')}</div>`},
role(){return `<div class="box narrow"><h2 style="margin-top:0">Daftar sebagai</h2>${[['penumpang','👤 Penumpang','Pesan perjalanan antar kota'],['pengemudi','🚗 Pengemudi','Bawa mobil mitra &amp; terima order']].map(r=>`<div class="sel" onclick="S.role='${r[0]}';go('reg',1)"><b style="font-size:24px">${r[1].split(' ')[0]}</b><div><b>${r[1].slice(3)}</b><div class="mut">${r[2]}</div></div></div>`).join('')}<p class="mut">Sudah punya akun? <a href="#" onclick="go('login');return false" style="color:var(--pri)">Masuk</a></p></div>`},
login(){return `<div class="box narrow"><h2 style="margin-top:0">Masuk</h2><div class="tabs"><button class="tab ${S.role==='penumpang'?'on':''}" onclick="S.role='penumpang';render()">Penumpang</button><button class="tab ${S.role==='pengemudi'?'on':''}" onclick="S.role='pengemudi';render()">Pengemudi</button></div><div class="f"><label>Email</label><input id="e" type="email"></div><div class="f"><label>Password</label><input id="p" type="password"></div><button class="btn w" onclick="doLogin()">Masuk</button><p class="mut">Belum punya akun? <a href="#" onclick="go('role');return false" style="color:var(--pri)">Daftar</a></p></div>`},
reg(){const d=S.role==='pengemudi',n=d?3:2,s=S.step;
const bar=`<div class="steps">${[...Array(n)].map((_,i)=>`<span class="${i<s?'on':''}"></span>`).join('')}</div><div class="mut">Langkah ${s} dari ${n} · ${d?'Pengemudi':'Penumpang'}</div>`;
if(s===1)return `<div class="box narrow">${bar}<h2>Buat akun</h2><div class="f"><label>Email</label><input id="e" type="email"></div><div class="f"><label>Password</label><input id="p" type="password"></div><button class="btn w" onclick="regNext()">Lanjut</button></div>`;
if(s===2&&!d)return `<div class="box narrow">${bar}<h2>Data diri</h2><div class="f"><label>Username</label><input id="un"></div><div class="f"><label>Nama lengkap</label><input id="nm"></div><div class="f"><label>No. HP / WhatsApp</label><input id="hp" type="tel"></div><button class="btn w" onclick="finishPass()">Simpan &amp; selesai</button></div>`;
if(s===2)return `<div class="box narrow">${bar}<h2>Unggah dokumen</h2><div class="f up"><label>Foto KTP</label><input type="file" accept="image/*" id="ktp"></div><div class="f up"><label>Foto SIM</label><input type="file" accept="image/*" id="sim"></div><button class="btn w" onclick="submitDocs()">Kirim untuk verifikasi</button></div>`;
const st=S.drvState;return `<div class="box narrow">${bar}<div style="text-align:center;font-size:54px">${st==='ok'?'🎉':st==='no'?'❌':'⏳'}</div><h2 style="text-align:center">${st==='ok'?'Akun disetujui':st==='no'?'Dokumen ditolak':'Menunggu verifikasi'}</h2>${st==='no'?`<div class="note"><b>Catatan admin:</b> Foto SIM buram, mohon unggah ulang.</div><button class="btn w" onclick="S.drvState='';go('reg',2)">Unggah ulang dokumen</button>`:st==='ok'?`<button class="btn w" onclick="go('drvhome')">Masuk ke dashboard</button>`:`<p class="mut" style="text-align:center">Admin sedang memeriksa KTP &amp; SIM. Kamu belum bisa menerima perjalanan.</p>`}<hr style="border-color:var(--bd)"><div class="mut">Simulasi (demo):</div><div style="display:flex;gap:8px;margin-top:6px"><button class="btn o w" onclick="S.drvState='ok';render()">Admin setujui</button><button class="btn o w" onclick="S.drvState='no';render()">Admin tolak</button></div></div>`},
drvhome(){return `<div class="box narrow"><h2 style="margin-top:0">Halo, ${S.user.name||'Driver'} 👋</h2><div class="note">Status: <b>Terverifikasi</b>. Kamu dapat menerima perjalanan.</div><div class="card" style="padding:14px"><b>Order baru</b><div class="mut">Kepanjen → Surabaya · Reguler · 2 penumpang</div><br><button class="btn">Terima</button> <button class="btn o">Tolak</button></div></div>`},
book(){const p=P[S.pkg],shared=S.pkg!=='private';
const cars=[...CARS].sort((a,b)=>S.pkg==='door'?b.fill-a.fill:0);
return `<div style="margin-top:20px"><h2 style="margin-top:0">${S.from} → ${S.to}</h2><div class="tabs">${Object.keys(P).map(k=>`<button class="tab ${S.pkg===k?'on':''}" onclick="setPkg('${k}');render()">${P[k].n}</button>`).join('')}</div>
<div class="box"><b>Jenis jalan</b><div class="tabs" style="margin-top:8px"><button class="tab ${S.road==='biasa'?'on':''}" onclick="S.road='biasa';render()">Jalan biasa ${S.pkg==='reguler'?'(default)':''}</button><button class="tab ${S.road==='tol'?'on':''}" onclick="S.road='tol';render()">Jalan tol ${S.pkg==='reguler'?'(+ tambahan)':S.pkg==='private'?'(default)':''}</button></div></div>
${S.pkg==='reguler'?`<div class="box"><b>Mobil &amp; driver: acak</b><p class="mut">Ditentukan sistem. Setelah checkout, datang ke garasi keberangkatan di ${S.from} dan turun di garasi ${S.to}.</p></div>`:`<div class="box"><b>Titik jemput &amp; drop off</b><div class="f"><label>📍 Titik jemput</label><input id="pick" value="${S.pick}" placeholder="Alamat / patokan" onchange="S.pick=this.value"></div><div class="f"><label>🏁 Titik drop off</label><input id="drop" value="${S.drop}" placeholder="Alamat / patokan" onchange="S.drop=this.value"></div></div>
<div class="box"><b>${S.pkg==='door'?'Pilih mobil':'Pilih mobil &amp; driver'}</b>${S.pkg==='door'?'<div class="mut">Mobil yang sudah berisi ditampilkan paling atas.</div>':''}
${cars.map(c=>{const i=CARS.indexOf(c);return `<div class="sel ${S.car===i?'on':''}" onclick="S.car=${i};render()"><div style="font-size:30px">🚐</div><div style="flex:1"><b>${c.n}</b> <span class="mut">${c.pl}</span><div class="mut">${S.pkg==='private'?`Driver: ${c.d} · ⭐ ${c.r}`:c.dir}</div></div>${S.pkg==='door'&&c.fill?`<span class="pill g">${c.fill}/${c.seat} terisi</span>`:''}</div>`}).join('')}</div>`}
${shared?`<div class="note">👥 Penumpang dengan tujuan berbeda tapi <b>searah</b> digabung dalam satu mobil (mis. Kepanjen → Malang &amp; Kepanjen → Surabaya).</div>`:`<div class="note">🔒 Private: mobil hanya untuk rombonganmu.</div>`}
<div class="box"><label style="display:flex;gap:10px;align-items:center;color:var(--tx);font-size:15px;margin:0"><input type="checkbox" style="width:auto" ${S.ins?'checked':''} onchange="S.ins=this.checked"> 🛡️ <span><b>Proteksi keamanan (asuransi)</b><br><span class="mut" style="font-weight:400">Perlindungan selama perjalanan</span></span></label></div>
<div class="box" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div style="flex:1"><div class="mut">Total harga</div><b style="font-size:18px">Segera diumumkan</b><div class="mut">Perhitungan harga menyusul</div></div><button class="btn a" onclick="checkout()">Checkout</button></div></div>`},
data(){return `<div class="box narrow"><h2 style="margin-top:0">Isi data diri</h2><p class="mut">${S.user?'Lengkapi data diri sebelum order dibuat.':'Isi data diri untuk melanjutkan checkout (akun dibuat otomatis).'}</p><div class="f"><label>Nama lengkap</label><input id="nm"></div><div class="f"><label>No. HP / WhatsApp</label><input id="hp" type="tel"></div>${S.user?'':'<div class="f"><label>Email</label><input id="e" type="email"></div>'}<button class="btn w" onclick="saveData()">${S.user?'Simpan &amp; lanjut':'Checkout'}</button></div>`},
done(){const u=S.user,c=CARS[S.pkg==='reguler'?0:S.car],p=P[S.pkg],st=S.cancelled?-1:S.st,can=st>=0&&st<4;
if(S.cancelled)return `<div class="box narrow" style="text-align:center"><div style="font-size:54px">🚫</div><h2>Pesanan dibatalkan</h2><button class="btn w" onclick="S.cancelled=false;go('home')">Kembali ke beranda</button></div>`;
return `<div style="max-width:560px;margin:20px auto"><div class="box"><h2 style="margin:0">Pesanan ${st>=5?'selesai':'dikonfirmasi'} ✅</h2><div class="mut">No. order #NS-${S.oid}</div><div class="tl">${STAT.map((s,i)=>`<span class="${i<=st?'on':''}">${s}</span>`).join('')}</div>
${st<5?`<button class="btn o" onclick="S.st++;render()">Simulasi: lanjut status ›</button>`:''}</div>
${st>=2?`<div class="box"><b>Identitas driver</b><div class="drv" style="margin-top:10px"><div class="av">${c.d[0]}</div><div><b>${c.d}</b><div class="mut">${c.n} · ${c.pl}</div><div>⭐ ${c.r}</div></div></div>${S.pkg==='reguler'?`<div class="note">Datang ke garasi ${S.from} sesuai jadwal.</div>`:''}</div>`:''}
<div class="box"><b>🧾 Invoice</b><table style="width:100%;margin:8px 0"><tr><td class="mut">Nama</td><td>${u.name||u.email}</td></tr><tr><td class="mut">Tujuan</td><td>${S.from} → ${S.to}</td></tr><tr><td class="mut">Paket</td><td>${p.n} · jalan ${S.road}${S.ins?' · asuransi':''}</td></tr></table><button class="btn o w" onclick="dlInvoice()">Unduh ulang invoice</button></div>
${st>=5?`<div class="box"><b>Beri rating untuk ${c.d}</b><div class="stars">${[1,2,3,4,5].map(i=>`<button class="${S.rating>=i?'on':''}" onclick="S.rating=${i};render()">★</button>`).join('')}</div><input placeholder="Ulasan singkat (opsional)"><br><br><button class="btn w" onclick="toast('Terima kasih atas penilaianmu!')">Kirim rating</button></div>`:''}
${can?`<div class="box"><b>Batalkan pesanan</b><div class="f"><select id="why"><option>Berubah rencana</option><option>Salah pilih paket</option><option>Driver terlalu lama</option></select></div><button class="btn r w" onclick="S.cancelled=true;render()">Batalkan</button></div>`:st===4?`<div class="note">Perjalanan berlangsung dan tidak bisa dibatalkan di aplikasi. Hubungi Customer Service (CS).</div>`:''}
</div>`}};
function setPkg(k){S.pkg=k;S.road=P[k].road;S.car=0}
function doLogin(){const e=$('#e').value;if(!e)return toast('Isi email');S.user={email:e,role:S.role,name:'',profile:false};if(S.role==='pengemudi'){S.user.name='Driver';go('drvhome')}else go('home')}
function regNext(){const e=$('#e').value;if(!e||!$('#p').value)return toast('Lengkapi email &amp; password'.replace('&amp;','&'));S.user={email:e,role:S.role,name:'',profile:false};go('reg',2)}
function finishPass(){S.user.name=$('#nm').value||$('#un').value;S.user.profile=true;toast('Akun berhasil dibuat');go('home')}
function submitDocs(){S.drvState='';S.user.name='Driver';go('reg',3)}
function checkout(){if(S.user&&S.user.profile)return confirmOrder();go('data')}
function saveData(){const nm=$('#nm').value,hp=$('#hp').value;if(!nm||!hp)return toast('Lengkapi data diri');if(!S.user)S.user={email:($('#e')&&$('#e').value)||'tamu@mail.com',role:'penumpang'};S.user.name=nm;S.user.profile=true;confirmOrder()}
function confirmOrder(){S.oid=Math.floor(1000+Math.random()*9000);S.st=2;S.cancelled=false;S.rating=0;go('done');dlInvoice(true)}
function dlInvoice(auto){const u=S.user,t=`INVOICE #NS-${S.oid}\nNama: ${u.name||u.email}\nTujuan: ${S.from} → ${S.to}\nPaket: ${P[S.pkg].n} (${S.road})\nHarga: menyusul`;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='invoice-NS-'+S.oid+'.txt';document.body.appendChild(a);a.click();a.remove();toast(auto?'Invoice otomatis terunduh':'Invoice diunduh')}catch(e){toast('Unduhan tidak tersedia di pratinjau')}}
render();
</script></body></html>
