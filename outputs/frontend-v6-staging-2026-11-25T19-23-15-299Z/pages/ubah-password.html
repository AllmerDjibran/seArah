<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ubah Password — SeArah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/typography.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/profile.css">
<link rel="stylesheet" href="../css/flow.css">
<link rel="stylesheet" href="../css/contact.css">
</head>
<body>

<div id="navbar-slot"></div>

<main class="wrap">
  <div class="profile-wrap" style="max-width:560px;margin:24px auto 60px">
    <div class="profile-card">
      <h1>Ubah Password Akun</h1>
      <p class="sub" style="text-align:left;margin-bottom:20px">Jaga keamanan akun Anda dengan mengganti password secara berkala.</p>

      <form id="pw-form" style="display:flex;flex-direction:column;gap:18px" novalidate>
        <div class="field">
          <label for="old">Password Saat Ini</label>
          <input id="old" name="old" type="password" placeholder="••••••••" required>
        </div>
        <div class="field">
          <label for="pw">Password Baru</label>
          <input id="pw" name="pw" type="password" placeholder="Minimal 6 karakter" required>
        </div>
        <div class="field">
          <label for="pw2">Konfirmasi Password Baru</label>
          <input id="pw2" name="pw2" type="password" placeholder="Ketik ulang password baru" required>
        </div>
      </form>

      <div class="profile-actions" style="margin-top:24px">
        <a class="btn btn--ghost" href="profil.html">Batal</a>
        <button class="btn btn--primary" id="btn-save-pw">Simpan Password Baru</button>
      </div>
    </div>
  </div>
</main>

<div id="footer-slot"></div>

<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
  UI.navbar("auto");
  UI.footer();

  if (!UI.requireAuth()) throw new Error("redirect");
  const f = document.getElementById("pw-form");

  document.getElementById("btn-save-pw").addEventListener("click", async (e) => {
    e.preventDefault();
    let ok = true;
    [f.old, f.pw, f.pw2].forEach(UI.fieldClear);

    if (!f.old.value) {
      UI.fieldError(f.old, "Password lama wajib diisi.");
      ok = false;
    }
    if (f.pw.value.length < 6) {
      UI.fieldError(f.pw, "Password baru minimal 6 karakter.");
      ok = false;
    }
    if (f.pw2.value !== f.pw.value) {
      UI.fieldError(f.pw2, "Konfirmasi password baru tidak cocok.");
      ok = false;
    }
    if (!ok) return;

    try {
      await api.changePassword({ oldPassword: f.old.value, newPassword: f.pw.value });
      UI.toast("Password Anda berhasil diubah!", "success");
      setTimeout(() => {
        location.href = "profil.html";
      }, 400);
    } catch (err) {
      UI.fieldError(f.old, err.message);
      UI.toast(err.message, "error");
    }
  });
</script>
</body>
</html>
