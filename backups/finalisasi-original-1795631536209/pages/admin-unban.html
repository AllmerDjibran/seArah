<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Permohonan Unban — Admin SeArah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/typography.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/contact.css">
</head>
<body>

<div id="navbar-slot"></div>

<main class="wrap">
  <div style="max-width:960px;margin:24px auto 60px">
    <div class="flow-card">
      <h1 style="margin:0 0 4px">🔓 Review Permohonan Unban</h1>
      <p style="font-size:var(--text-sm);color:var(--color-muted);margin:0 0 16px">
        Akun yang diblokir dapat mengajukan banding (maks. 1x per minggu, reset hari Minggu). Tinjau permohonan di bawah.
      </p>
      <div id="unban-list" style="display:flex;flex-direction:column;gap:12px"></div>
    </div>
  </div>
</main>

<div id="footer-slot"></div>

<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
  UI.navbar("auto");
  UI.footer();

  const sess = api.getSession();
  if (!sess || sess.role !== "admin") {
    UI.toast("Halaman ini khusus administrator.", "warning");
    setTimeout(() => { location.href = "masuk.html"; }, 500);
  }

  const roleLabel = (r) => r === "pengemudi" ? "Pengemudi" : r === "penumpang" ? "Penumpang" : r;

  function render() {
    const list = api.listUnbanRequests();
    const el = document.getElementById("unban-list");
    if (!list.length) {
      el.innerHTML = `<div style="text-align:center;padding:36px;color:var(--color-muted)">Tidak ada permohonan unban.</div>`;
      return;
    }
    el.innerHTML = list.map((q) => {
      const st = q.status === "menunggu" ? `<span class="pill pill--orange">Menunggu</span>`
        : q.status === "disetujui" ? `<span class="pill pill--green">Disetujui</span>`
        : `<span class="pill" style="background:#fee2e2;color:#dc2626">Ditolak</span>`;
      return `
        <div style="border:1.5px solid var(--color-border);border-radius:12px;padding:16px;background:var(--color-white)">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
            <div>
              <b style="color:var(--color-navy)">${q.name}</b> <span class="pill pill--gray" style="font-size:11px">${roleLabel(q.role)}</span>
              <div style="font-size:12px;color:var(--color-muted);margin-top:2px">${q.email} · ${new Date(q.created_at).toLocaleString("id-ID")}</div>
              <div style="font-size:13px;margin-top:6px">Alasan: <i>"${q.reason || "-"}"</i></div>
              ${q.review_note ? `<div style="font-size:12px;color:#15803d;margin-top:4px">Catatan admin: ${q.review_note}</div>` : ""}
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
              ${st}
              ${q.status === "menunggu" ? `
                <div style="display:flex;gap:8px">
                  <button class="btn btn--primary btn--sm" data-ok="${q.id}">✓ Setujui</button>
                  <button class="btn btn--danger btn--sm" data-no="${q.id}">✗ Tolak</button>
                </div>
              ` : ""}
            </div>
          </div>
        </div>
      `;
    }).join("");

    el.querySelectorAll("[data-ok]").forEach((b) => b.addEventListener("click", async () => {
      await api.reviewUnban(b.dataset.ok, true, "Disetujui admin");
      UI.toast("Permohonan disetujui; akun diaktifkan kembali.", "success");
      render();
    }));
    el.querySelectorAll("[data-no]").forEach((b) => b.addEventListener("click", async () => {
      await api.reviewUnban(b.dataset.no, false, "Ditolak admin");
      UI.toast("Permohonan ditolak.", "info");
      render();
    }));
  }

  render();
</script>
</body>
</html>
